services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=${PORT:-5000}
      - MONGODB_URI=${MONGODB_URI:-}
      - JWT_SECRET=${JWT_SECRET:-}
    restart: always

  frontend:
    build: ./fronted
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
